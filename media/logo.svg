<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- A page with its corner folded, and an eye on it: the file, looked at.

       The page is the silhouette no other mark in the catalogue has; every
       neighbour is a rounded square, a pin, a clip or a magnifier. The fold is
       what makes it a document rather than a card, and the eye is what makes
       it this control rather than File Drop or Attachment List.

       The ramp is the PCFHub mark's own, verbatim, so this sits in the family
       rather than beside it. Declared in userSpaceOnUse and spanning the whole
       96 canvas, so the mark reads as one object lit from the top right.

       Drawn for 32px. Rejected on the contact sheet, 2 Oct 2026:
       an eye as the silhouette with the page as its pupil read as an eye, so
       "show password", and the page vanished at 24; a sun over mountains on
       the page read as "image file", which undersells the PDF; an outlined eye
       went thin at 24; the fold as a 0.6 tint went soft at 24, where the
       crease drawn as a hole stays a fold; a catch-light in the pupil smeared
       it at 24; a wider page to give the eye more room went squat and stopped
       reading as paper.

       The page is filled and stroked with the same paint, 10 wide, which
       rounds its corners by 5 to sit with the family's softer cards. The
       crease is 5 wide.

       Note: no double hyphen may appear in this comment, or the whole document
       fails to parse as XML. -->
  <defs>
    <linearGradient id="file-preview-ramp" x1="6" y1="82" x2="90" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A684FF"/><stop offset="0.6" stop-color="#7C86FF"/><stop offset="1" stop-color="#00BCFF"/>
    </linearGradient>
  </defs>
  <!-- The page. -->
  <path d="M23 13 H56 L73 30 V83 H23 Z" fill="url(#file-preview-ramp)"
        stroke="url(#file-preview-ramp)" stroke-width="10" stroke-linejoin="round"/>

  <!-- The fold. -->
  <path d="M55 14 V31 H72" stroke="#F8FAFC" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The eye. -->
  <path d="M25 62 Q48 34 71 62 Q48 90 25 62 Z" fill="#F8FAFC"
        stroke="#F8FAFC" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="48" cy="62" r="8.5" fill="url(#file-preview-ramp)"/>
</svg>
